name: iOS CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme InterviewBank \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
