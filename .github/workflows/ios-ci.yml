name: iOS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint

  tests:
    name: Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run unit tests
        run: |
          xcodebuild test \
            -scheme InterviewBank \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:InterviewBankTests
