name: iOS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint

  tests:
    name: Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run unit tests
        run: |
          xcodebuild test \
            -scheme InterviewBank \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:InterviewBankTests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      - name: Convert coverage for SonarCloud
        run: |
          bash Scripts/xccov-to-sonarqube-generic.sh TestResults.xcresult > sonarqube-generic-coverage.xml
          ls -la sonarqube-generic-coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonar-coverage
          path: sonarqube-generic-coverage.xml

  sonarcloud:
    name: SonarCloud
    runs-on: macos-15
    needs: [lint, tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: sonar-coverage
          path: .

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
